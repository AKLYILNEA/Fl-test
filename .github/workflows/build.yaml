name: Rust build

on:
  push:
    tags:
      - 'v*-rs.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  FLUTTER_VERSION: '3.50.1'
  NDK_VERSION: r28c
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64
            target: apk
          - platform: windows
            os: windows-2022
            arch: amd64
            target: exe
    steps:
      - name: Free Android build space
        if: matrix.platform == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          sudo docker system prune --all --force --volumes || true
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=concord/assets/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nasm --no-progress -y > /dev/null
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE || secrets.FLCLASH || secrets.flclash }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.FLCLASH_KEY_ALIAS || 'flclash' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.FLCLASH_STORE_PASSWORD || 'flclash123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.FLCLASH_KEY_PASSWORD || 'flclash123456' }}
        run: |
          python3 - << 'EOF'
          import base64, os, sys

          raw = "".join(os.environ.get("KEYSTORE_BASE64", "").split())
          if not raw:
              sys.exit(
                  "The KEYSTORE secret is empty. An APK signed with the per-machine "
                  "debug key changes certificate on every run and cannot be installed "
                  "over the existing app, so the build stops here."
              )
          raw += "=" * (-len(raw) % 4)
          data = base64.b64decode(raw, validate=True)
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/keystore.jks", "wb") as f:
              f.write(data)
          with open("android/local.properties", "a", encoding="utf-8") as f:
              f.write(
                  f"\nkeyAlias={os.environ['KEY_ALIAS']}\n"
                  f"storePassword={os.environ['STORE_PASSWORD']}\n"
                  f"keyPassword={os.environ['KEY_PASSWORD']}\n"
              )
          print(f"Keystore written: {len(data)} bytes")
          EOF
          # Catches a truncated secret or a password that does not match the
          # store before Gradle turns it into a silent debug-signed APK.
          keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"
          keytool -list -v -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA256:'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get
      - name: Test Android service and native modules
        if: matrix.platform == 'android'
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          printf '\nflutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" >> local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest :core:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Check generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: Check Dart
        run: flutter analyze --no-fatal-infos lib test
      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart tool/package.dart ${{ matrix.platform }} --env dev --arch ${{ matrix.arch }} --targets ${{ matrix.target }} -v
      - name: Verify Android signature
        if: startsWith(matrix.platform,'android')
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.FLCLASH_KEY_ALIAS || 'flclash' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.FLCLASH_STORE_PASSWORD || 'flclash123456' }}
        run: |
          shopt -s nullglob
          apks=(dist/*.apk)
          test "${#apks[@]}" = 1
          apk="${apks[0]}"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" | grep -E "^package: name='com\.follow\.clash\.rs\.dev'"
          "$aapt" dump badging "$apk" | grep -Ex "native-code: 'arm64-v8a'[[:space:]]*"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          expected=$(keytool -list -v -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "keystore: $expected"
          echo "apk:      $actual"
          if [ -z "$expected" ] || [ -z "$actual" ]; then
            echo "::error::Could not read the certificate fingerprint for $apk."
            exit 1
          elif [ "$expected" != "$actual" ]; then
            echo "::error::$apk is not signed with the release keystore."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.target }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.apk *.exe > "FlClash-${GITHUB_REF_NAME#v}-SHA256SUMS"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FlClash Rust ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.exe
            dist/*-SHA256SUMS
